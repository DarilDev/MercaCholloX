name: Refrescar precios de Lidl (Open Prices)

# Aislado del refresco de las demás cadenas (ver docs/DECISIONS.md).
#
# Sin `schedule`: paginar las 6.900 ubicaciones de Open Prices en cada
# ejecución no es gratis, y los precios de la comunidad no cambian con
# frecuencia — se dispara a mano cuando interese refrescar.
on:
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Aplicar migraciones
        working-directory: backend
        env:
          MERCACHOLLO_DATABASE_URL: ${{ secrets.MERCACHOLLO_DATABASE_URL }}
        run: alembic upgrade head

      - name: Refrescar precios de Lidl
        working-directory: backend
        env:
          MERCACHOLLO_DATABASE_URL: ${{ secrets.MERCACHOLLO_DATABASE_URL }}
        run: python -m app.workers.refresh_lidl_prices
